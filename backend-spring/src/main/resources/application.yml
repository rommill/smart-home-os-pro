server:
  port: 8082

spring:
  application:
    name: backend-spring

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_home_db
    username: admin
    password: smart_password
    driver-class-name: org.postgresql.Driver

  # Required for executing data.sql scripts correctly during initialization
  sql:
    init:
      mode: always

  jpa:
    # Key fix: defers data.sql execution until Hibernate schema update is complete
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

smart:
  home:
    jwt:
      secret: "mySuperSecretKeyForSmartHomeOsProProject2026SecureString"

# --- MQTT Broker Configuration / Конфигурация MQTT брокера ---

# Сетевой порт для прослушивания подключений
# Network port to listen for connections
listener 1883

# Безопасность: запрещаем анонимные подключения (требуем учетные данные)
# Security: disallow anonymous connections (require credentials)
allow_anonymous false

# Путь внутри контейнера к файлу с хэшами паролей пользователей
# Path inside the container to the file containing user password hashes
password_file /mosquitto/config/password_file

# Уровни логирования для отладки и мониторинга в контейнере
# Logging levels for debugging and monitoring within the container
log_type error
log_type warning
log_type notice
log_type information

# Настройка персистентности данных (сохранение на диск)
# Data persistence configuration (saving to disk)
persistence true
persistence_location /mosquitto/data/
name: Smart Home OS Pro CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Spring Boot (Java 21) Unit & Integration Testing
  test-spring:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x backend-spring/gradlew

      - name: Execute Gradle Tests
        run: |
          cd backend-spring
          ./gradlew test

  # 2. Go Telemetry Engine Testing
  test-go:
    name: Build & Test Go Telemetry Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Execute Go Tests
        run: |
          cd backend
          go test -v ./...

  # 3. Validate Multi-Container Docker Build
  docker-build:
    name: Validate Docker Compose Stack
    needs: [test-spring, test-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Services
        run: docker compose build

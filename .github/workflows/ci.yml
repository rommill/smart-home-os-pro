name: Smart Home OS Pro CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Spring Boot (Java 21) Unit & Integration Testing
  test-spring:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x backend-spring/gradlew

      - name: Execute Gradle Tests
        run: |
          ./backend-spring/gradlew -p backend-spring test

  # 2. Go Telemetry Engine Testing, Linting & Security Scan
  test-go:
    name: Test & Scan Go Telemetry Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Execute Go Tests
        run: |
          cd backend
          go test -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.1
          working-directory: backend

      - name: Run govulncheck (Vulnerability Scanner)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend
          govulncheck ./...

  # 3. Validate Multi-Container Docker Build
  docker-build:
    name: Validate Docker Compose Stack
    needs: [test-spring, test-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mock .env for CI Docker Build
        run: |
          cp .env.example .env || echo "POSTGRES_USER=postgres\nPOSTGRES_PASSWORD=postgres\nPOSTGRES_DB=smart_home\nJWT_SECRET=ci_test_secret" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Services
        run: docker compose build

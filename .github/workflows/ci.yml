name: Smart Home OS Pro CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Spring Boot (Java 21) Unit & Integration Testing
  test-spring:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x backend-spring/gradlew

      - name: Execute Gradle Tests
        run: ./backend-spring/gradlew -p backend-spring test

  # 2. Go Telemetry Engine Testing, Linting & Security Scan
  test-go:
    name: Test & Scan Go Telemetry Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Execute Go Tests
        run: |
          cd backend
          go test -v ./...

      - name: Run Go Vet (Static Code Analysis)
        run: |
          cd backend
          go vet ./...

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.0
          cd backend
          golangci-lint run

      - name: Run Go Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend
          govulncheck ./... || echo "govulncheck completed with advisories"

  # 3. Validate Multi-Container Docker Build
  docker-build:
    name: Validate Docker Compose Stack
    needs: [test-spring, test-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mock .env for CI Docker Build
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            cat <<'ENVEOF' > .env
POSTGRES_USER=postgres
POSTGRES_PASSWORD=ci_test_postgres_password
POSTGRES_DB=smart_home_db
POSTGRES_URL=postgresql://postgres:ci_test_postgres_password@db_relational:5432/smart_home_db?sslmode=disable
MONGO_URI=mongodb://db_nosql:27017
MQTT_BROKER=tcp://broker:1883
MQTT_USER=ci_mqtt_user
MQTT_PASSWORD=ci_test_mqtt_password
PORT=8080
GO_BACKEND_URL=http://backend_go:8080/api/v1/telemetry
JWT_SECRET=ci_test_jwt_secret_key_change_in_prod
SERVICE_API_KEY=ci_test_service_api_key_change_in_prod
ALLOWED_ORIGIN=http://localhost:5500
GF_SECURITY_ADMIN_USER=admin
GF_SECURITY_ADMIN_PASSWORD=ci_test_grafana_password
ENVEOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Services
        run: docker compose build

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <title>Smart Home Dashboard PRO</title>
  </head>
  <body
    class="bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-500"
  >
    <div class="container mx-auto px-4 py-8 flex-grow">
      <header
        class="flex justify-between items-center mb-10 border-b border-slate-200 dark:border-slate-800/80 pb-5 transition-colors"
      >
        <div class="flex items-center gap-3">
          <h1
            class="text-3xl font-extrabold text-slate-900 dark:text-emerald-400 tracking-tight transition-colors"
          >
            SmartHome OS
          </h1>
          <span
            class="text-xs font-bold bg-slate-100 dark:bg-emerald-500/10 text-slate-600 dark:text-emerald-400 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-emerald-500/20 transition-all"
            >PRO</span
          >
        </div>

        <div class="flex items-center gap-3">
          <button
            id="theme-btn"
            class="w-9 h-9 flex items-center justify-center bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-lg rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm transition-all active:scale-95"
          ></button>

          <select
            id="lang-select"
            class="bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-1.5 text-sm font-medium focus:outline-none focus:border-emerald-500 transition-all cursor-pointer shadow-sm"
          >
            <option value="ru">🇷🇺 RU</option>
            <option value="et">🇪🇪 ET</option>
            <option value="en">🇬🇧 EN</option>
          </select>

          <div
            id="status"
            class="text-xs font-medium"
            data-i18n="statusLoading"
          >
            Загрузка...
          </div>
          <button
            id="logout-btn"
            class="hidden text-xs font-semibold bg-white dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-slate-500 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-rose-200 dark:hover:border-rose-900/50 transition-all"
            data-i18n="logoutBtn"
          >
            Выйти
          </button>
        </div>
      </header>

      <section
        id="login-section"
        class="max-w-md mx-auto my-20 bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700"
      >
        <h2
          class="text-2xl font-bold text-center mb-6 text-slate-100"
          data-i18n="loginTitle"
        >
          Вход в систему
        </h2>
        <form id="login-form" class="space-y-4">
          <div>
            <label
              for="username"
              class="block text-sm font-medium text-slate-400 mb-1"
              data-i18n="usernameLabel"
            >
              Имя пользователя
            </label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              required
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-all"
            />
          </div>
          <div>
            <label
              for="password"
              class="block text-sm font-medium text-slate-400 mb-1"
              data-i18n="passwordLabel"
            >
              Пароль
            </label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition-all"
            />
          </div>
          <button
            type="submit"
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/20 transition-all mt-6"
            data-i18n="loginBtn"
          >
            Войти
          </button>
        </form>
      </section>

      <main id="main-dashboard" class="hidden">
        <div
          id="rooms-grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
        ></div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

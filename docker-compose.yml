# --- Networks / Сети ---
networks:
  smart_network:
    driver: bridge

# --- Volumes / Тома для хранения данных ---
volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:

services:
  # --- 1. Relational Database / Реляционная база данных (PostgreSQL) ---
  db_relational:
    image: postgres:16-alpine
    container_name: smart_postgres
    restart: unless-stopped
    ports:
      # [EN] Bind to localhost only for local debugging/migrations; remove for strict container isolation
      # [RU] Привязка только к 127.0.0.1 для локальной отладки; для строгой изоляции порт можно убрать
      - "127.0.0.1:5432:5432"
    networks:
      - smart_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smart_home_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_home_db}",
        ]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- 2. NoSQL Database / NoSQL база данных (MongoDB) ---
  db_nosql:
    image: mongo:7-jammy
    container_name: smart_mongo
    restart: unless-stopped
    ports:
      # [EN] Bind to localhost only; remove port mapping in production so only internal services connect
      # [RU] Привязка только к 127.0.0.1; в проде лучше убрать проброс наружу
      - "127.0.0.1:27017:27017"
    networks:
      - smart_network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- 3. MQTT Broker / Брокер MQTT (Eclipse Mosquitto) ---
  broker:
    image: eclipse-mosquitto:2.0
    container_name: smart_mqtt
    restart: unless-stopped
    ports:
      # [EN] Access only from host (127.0.0.1), external internet access is closed
      # [RU] Доступ только с хоста (127.0.0.1), наружу порт закрыт
      - "127.0.0.1:1883:1883"
    volumes:
      - ./backend/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./backend/mosquitto/password_file:/mosquitto/config/password_file
    networks:
      - smart_network

  # --- 4. Go Backend Service / Сервис бэкенда на Go ---
  backend_go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_go
    restart: unless-stopped
    networks:
      - smart_network
    ports:
      # [EN] Main backend API port
      # [RU] Основной API-порт бэкенда
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=Europe/Tallinn
      - PORT=${PORT:-8080}
      - POSTGRES_URL=${POSTGRES_URL:?POSTGRES_URL is required}
      - MONGO_URI=${MONGO_URI:?MONGO_URI is required}
      - MQTT_BROKER=${MQTT_BROKER:?MQTT_BROKER is required}
      # [EN] MQTT credentials without insecure fallback defaults
      # [RU] Учётные данные MQTT без небезопасных дефолтных значений
      - MQTT_USER=${MQTT_USER:?MQTT_USER is required}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD is required}
      - GO_BACKEND_URL=${GO_BACKEND_URL}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SERVICE_API_KEY=${SERVICE_API_KEY:?SERVICE_API_KEY is required}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:?ALLOWED_ORIGIN is required}
    depends_on:
      db_relational:
        condition: service_healthy
      db_nosql:
        condition: service_healthy

  # --- 5. Prometheus Monitoring / Мониторинг метрик (Prometheus) ---
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smart_prometheus
    restart: unless-stopped
    networks:
      - smart_network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # --- 6. Grafana Dashboards / Дашборды визуализации (Grafana) ---
  grafana:
    image: grafana/grafana:11.3.0
    container_name: smart_grafana
    restart: unless-stopped
    networks:
      - smart_network
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards/json
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

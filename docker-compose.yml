networks:
  smart_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  prometheus_data:
  grafana_data:

services:
  # --- 1. Relational Database ---
  db_relational:
    image: postgres:16-alpine
    container_name: smart_postgres
    restart: unless-stopped
    networks:
      - smart_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_home_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-smart_home_db}",
        ]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- 2. NoSQL Database ---
  db_nosql:
    image: mongo:7-jammy
    container_name: smart_mongo
    restart: unless-stopped
    networks:
      - smart_network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- 3. MQTT Broker ---
  broker:
    image: eclipse-mosquitto:2.0
    container_name: smart_mqtt
    restart: unless-stopped
    networks:
      - smart_network
    ports:
      - "1883:1883"
    entrypoint:
      [
        "sh",
        "-c",
        "echo 'listener 1883\nallow_anonymous true' > /tmp/mosquitto.conf && exec mosquitto -c /tmp/mosquitto.conf",
      ]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5

  # --- 4. Go Backend Service ---
  backend_go:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_go
    restart: unless-stopped
    networks:
      - smart_network
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Tallinn
      - PORT=${PORT:-8080}
      - POSTGRES_URL=${POSTGRES_URL}
      - MONGO_URI=${MONGO_URI}
      - MQTT_BROKER=${MQTT_BROKER}
      - GO_BACKEND_URL=${GO_BACKEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:3000}
    depends_on:
      db_relational:
        condition: service_healthy
      db_nosql:
        condition: service_healthy
      broker:
        condition: service_healthy

  # --- 5. Prometheus Monitoring ---
  prometheus:
    image: prom/prometheus:latest
    container_name: smart_prometheus
    restart: unless-stopped
    networks:
      - smart_network
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # --- 6. Grafana Dashboards ---
  grafana:
    image: grafana/grafana:latest
    container_name: smart_grafana
    restart: unless-stopped
    networks:
      - smart_network
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
